      function composeV3(nowT) {
        const sc = scenes[3];
        const bg = bgs[3];
        frameChar.set(bg.groundChar);
        frameCol.set(bg.groundCol);
        depthBuf.fill(1e9);

        const lt = nowT % V3_CYCLE;
        const cyc = Math.floor(nowT / V3_CYCLE);
        const shiftX = cyc === 0 ? 0 : Math.round(Math.sin(cyc * 1.9) * 3);
        const rot = 0.22 * nowT;

        // 1. Twinkling night stars
        for (let i = 0; i < bg.stars.length; i++) {
          const s = bg.stars[i];
          const idx = s.r * COLS + s.c;
          if (frameChar[idx] !== 0) continue;
          const b = s.b * (0.58 + 0.42 * Math.sin(nowT * s.sp + s.ph));
          frameChar[idx] = s.glyph;
          frameCol[idx * 3] = b * 0.85;
          frameCol[idx * 3 + 1] = b * 0.90;
          frameCol[idx * 3 + 2] = b;
        }

        // 2. Show-synced Gwangan Bridge LED illumination
        let brColA = V3_SAPPHIRE, brColB = V3_CYAN, brGain = 1.0;
        if (lt >= 2.8 && lt < 6.8) {
          brColA = V3_LAVENDER;
          brColB = V3_CORAL;
          brGain = 1.12;
        } else if (lt >= 6.8 && lt < 11.2) {
          brColA = V3_AMBER;
          brColB = WHITE;
          brGain = 1.28;
        } else if (lt >= 11.2 && lt < 17.0) {
          brColA = V3_GOLD;
          brColB = V3_CORAL;
          brGain = 1.32;
        }

        for (let c = 10; c <= 78; c++) {
          const wave = 0.5 + 0.5 * Math.sin(c * 0.19 - nowT * 1.6);
          const cy = v3CableY(c);
          if (cy >= 0) {
            const cr = Math.round(cy);
            const b = (0.34 + 0.42 * wave) * brGain;
            const tint = mix3(brColA, brColB, wave);
            putCell(frameChar, frameCol, cr, c, wave > 0.72 ? 42 : c % 2 === 0 ? 45 : 46, tint, b);
          }
          if (c >= 11 && c <= 77) {
            const dw = 0.5 + 0.5 * Math.cos(c * 0.16 + nowT * 1.3);
            const db = (0.30 + 0.36 * dw) * brGain;
            const dTint = mix3(brColA, V3_CHAMPAGNE, dw * 0.65);
            putCell(frameChar, frameCol, V3_DECK_Y, c, dw > 0.82 ? 35 : 61, dTint, db);
          }
        }
        // Bright pylon accent lights & aviation beacons
        for (const tc of [V3_T1, V3_T2]) {
          for (let r = 30; r < V3_SEA_Y; r += 2) {
            const pb = (0.42 + 0.25 * Math.sin(r * 0.6 - nowT * 2.5)) * brGain;
            putCell(frameChar, frameCol, r, tc, 124, brColB, pb);
          }
          const beacon = 0.45 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(nowT * 2.6), 3);
          putCell(frameChar, frameCol, 28, tc, 42, V3_CRIMSON, beacon);
        }

        // Helper: paint bright sky sparks (clamped above waterline)
        function paintSpark(row, col, ch, tint, lum) {
          if (row < 0 || row >= V3_SEA_Y || col < 0 || col >= COLS || lum <= 0.04) return;
          const idx = row * COLS + col;
          const curM = cellMax(frameCol, idx);
          if (lum > curM) {
            putCell(frameChar, frameCol, row, col, ch, tint, Math.min(lum, 1.32));
          }
        }

        // Helper: directional glyph for slope between (x0,y0) -> (x1,y1)
        function slopeGlyph(dx, dy) {
          const adx = Math.abs(dx * CW);
          const ady = Math.abs(dy * CH);
          if (adx < 0.01 && ady < 0.01) return 42; // '*'
          let deg = (Math.atan2(dy * CH, dx * CW) * 180) / Math.PI;
          deg = ((deg % 180) + 180) % 180;
          return deg < 22.5 || deg >= 157.5 ? 45 : deg < 67.5 ? 92 : deg < 112.5 ? 124 : 47;
        }

        // Helper: draw continuous streak segment with directional chars
        function drawSegment(x0, y0, x1, y1, tint, lum, chOverride) {
          const dx = x1 - x0;
          const dy = y1 - y0;
          const steps = Math.max(1, Math.min(8, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)))));
          const ch = chOverride || slopeGlyph(dx, dy);
          for (let s = 0; s <= steps; s++) {
            const u = s / steps;
            const cx = Math.round(x0 + dx * u);
            const cy = Math.round(y0 + dy * u);
            paintSpark(cy, cx, ch, tint, lum * (0.85 + 0.15 * u));
          }
        }

        // 3. 3D Volumetric Burst Shells with continuous directional light streaks
        for (let sIdx = 0; sIdx < sc.shells.length; sIdx++) {
          const sh = sc.shells[sIdx];
          const dt = lt - sh.t0;
          if (dt < 0 || dt >= sh.riseDur + sh.burstLife) continue;

          const tx = clamp(sh.tx + shiftX, 10, COLS - 10);
          const lx = clamp(sh.lx + shiftX * 0.4, 10, COLS - 10);

          if (dt < sh.riseDur) {
            // Ascending rocket with unbroken comet tail
            const p = dt / sh.riseDur;
            const e = 1 - (1 - p) * (1 - p);
            const rx = lx + (tx - lx) * e;
            const ry = 44 - (44 - sh.ty) * e;
            const pTail = Math.max(0, p - 0.18);
            const eTail = 1 - (1 - pTail) * (1 - pTail);
            const rtx = lx + (tx - lx) * eTail;
            const rty = 44 - (44 - sh.ty) * eTail;
            drawSegment(rtx, rty, rx, ry, V3_CHAMPAGNE, 0.82);
            paintSpark(Math.round(ry), Math.round(rx), 64, WHITE, 1.25);
          } else {
            const bt = dt - sh.riseDur;
            const life = bt / sh.burstLife;
            const flash = Math.pow(clamp(1 - bt / 0.24, 0, 1), 2);
            const shellYaw = sh.yaw0 + rot * 0.65;
            const cyaw = Math.cos(shellYaw), syaw = Math.sin(shellYaw);

            // Ignition center flare & expanding shockwave halo
            if (flash > 0.05) {
              const cix = Math.round(tx), ciy = Math.round(sh.ty);
              paintSpark(ciy, cix, 64, WHITE, 1.3 * flash + 0.35);
              paintSpark(ciy, cix - 1, 42, sh.colA, 1.0 * flash);
              paintSpark(ciy, cix + 1, 42, sh.colA, 1.0 * flash);
              paintSpark(ciy - 1, cix, 42, sh.colA, 0.95 * flash);
              paintSpark(ciy + 1, cix, 42, sh.colA, 0.95 * flash);
            }

            const nTail = sh.nTail;
            const baseFade = 1 - Math.pow(life, sh.fadePow);
            if (baseFade <= 0.04) continue;

            for (let i = 0; i < sh.pts.length; i++) {
              const pt = sh.pts[i];
              // Rotate ray direction around 3D Y axis
              const rvx = pt.vx * cyaw + pt.vz * syaw;
              const rvz = -pt.vx * syaw + pt.vz * cyaw;
              const rvy = pt.vy;
              const zFade = 0.65 + 0.45 * clamp(rvz / 22.0 + 0.5, 0.0, 1.0);
              const persp = 5.0 / Math.max(5.0 - rvz * 0.045, 2.5);

              let prevX = null, prevY = null;

              for (let k = 0; k < nTail; k++) {
                const tk = bt - k * sh.trailDt;
                if (tk < 0) continue;
                const dragF = (1 - Math.exp(-sh.drag * tk)) / sh.drag;
                const wx = rvx * pt.jitter * dragF * persp;
                const wy = rvy * pt.jitter * dragF * persp + 0.5 * sh.grav * tk * tk;
                const sx = tx + wx / ASPECT;
                const sy = sh.ty + wy;

                let lum = baseFade * (1 - k / (nTail + 0.4)) * zFade;
                if (sh.kind === "strobe" && life > 0.25) {
                  lum *= 0.25 + 1.05 * Math.max(0, Math.sin(nowT * 20.0 + pt.phase));
                } else if ((sh.kind === "kamuro" || sh.kind === "willow") && life > 0.35) {
                  lum *= 0.72 + 0.36 * Math.sin(nowT * 12.0 + pt.phase);
                }

                if (lum <= 0.05) {
                  prevX = sx;
                  prevY = sy;
                  continue;
                }

                const tailT = k / Math.max(nTail - 1, 1);
                const tint = k === 0
                  ? mix3(pt.col, WHITE, Math.max(flash * 0.9, 0.28))
                  : mix3(pt.col, V3_AMBER, tailT * 0.55);

                if (k === 0) {
                  const hx = Math.round(sx), hy = Math.round(sy);
                  const hCh = bt < 0.08 ? 42 : lum > 0.72 ? 42 : lum > 0.42 ? 43 : 46;
                  paintSpark(hy, hx, hCh, tint, lum * 1.25);
                } else if (prevX !== null) {
                  const chOverride = lum < 0.24 ? 46 : (k >= nTail - 2 && sh.kind === "kamuro" ? 58 : null);
                  drawSegment(sx, sy, prevX, prevY, tint, lum * 1.05, chOverride);
                }
                prevX = sx;
                prevY = sy;
              }
            }
          }
        }

        // 4. Diagonal X-Lattice Comet Mines along Gwangan Bridge
        function renderLatticeBurst(tStart, dur, colA, colB) {
          const dt = lt - tStart;
          if (dt < 0 || dt > dur) return;
          for (let i = 0; i < sc.lattice.length; i++) {
            const m = sc.lattice[i];
            const mt = dt - m.delay;
            if (mt < 0 || mt > dur - 0.08) continue;
            const p = mt / dur;
            const fade = Math.pow(clamp(1 - p, 0, 1), 1.1);
            const sx = m.x + m.vx * mt * 0.78 / ASPECT;
            const sy = V3_DECK_Y + m.vy * mt * 0.78 + 0.5 * 8.5 * mt * mt;
            const mtPrev = Math.max(0, mt - 0.34);
            const px = m.x + m.vx * mtPrev * 0.78 / ASPECT;
            const py = V3_DECK_Y + m.vy * mtPrev * 0.78 + 0.5 * 8.5 * mtPrev * mtPrev;
            const tint = mix3(colA, colB, 0.5 + 0.5 * Math.sin(m.phase + nowT * 4));
            drawSegment(px, py, sx, sy, tint, fade * 1.25);
            paintSpark(Math.round(sy), Math.round(sx), fade > 0.45 ? 42 : 43, WHITE, fade * 1.30);
          }
        }
        renderLatticeBurst(3.35, 1.45, V3_CORAL, V3_CHAMPAGNE);
        renderLatticeBurst(7.40, 1.65, WHITE, V3_GOLD);
        renderLatticeBurst(9.05, 1.55, V3_CHAMPAGNE, V3_CYAN);

        // 5. Gwangan Bridge Signature Niagara Waterfall (lt in 6.9 .. 10.7)
        if (lt >= 6.9 && lt <= 10.7) {
          const wt = lt - 6.9;
          const env = wt < 0.45 ? wt / 0.45 : wt > 3.1 ? Math.max(0, (3.8 - wt) / 0.7) : 1.0;
          for (let i = 0; i < sc.niagara.length; i++) {
            const colDrop = sc.niagara[i];
            const dropMax = 5.2 + env * 2.2;
            for (let s = 0; s < 6; s++) {
              const fall = (wt * colDrop.speed + colDrop.phase + s * 1.15) % colDrop.len;
              if (fall > dropMax) continue;
              const ry = Math.round(V3_DECK_Y + 1 + fall);
              if (ry >= V3_SEA_Y) continue;
              const fade = env * (1 - 0.78 * (fall / colDrop.len)) * (0.72 + 0.30 * Math.sin(nowT * 16 + s + colDrop.phase));
              const ch = fall < 2.2 ? 124 : fade > 0.60 ? 42 : 58;
              const tint = mix3(WHITE, V3_GOLD, fall / colDrop.len);
              paintSpark(ry, colDrop.c, ch, tint, fade * 1.15);
            }
          }
        }

        // 6. Barge Peacock Fan Fountains (Act 2 wing fans & Act 4 Grand Finale barges)
        function renderBargeFans(tStart, dur, useAll) {
          const dt = lt - tStart;
          if (dt < 0 || dt > dur) return;
          const env = dt < 0.25 ? dt / 0.25 : dt > dur - 0.5 ? Math.max(0, (dur - dt) / 0.5) : 1.0;
          for (let i = 0; i < sc.bargeFans.length; i++) {
            const f = sc.bargeFans[i];
            if (!useAll && f.bargeIdx === 1) continue;
            const pulseT = (dt + f.phase * 0.08) % 0.80;
            for (let k = 0; k < 4; k++) {
              const tk = pulseT - k * 0.11;
              if (tk < 0) continue;
              const sx = f.bx + f.vx * tk;
              const sy = 50.0 + f.vy * tk + 0.5 * 10.0 * tk * tk;
              const tkPrev = Math.max(0, tk - 0.22);
              const px = f.bx + f.vx * tkPrev;
              const py = 50.0 + f.vy * tkPrev + 0.5 * 10.0 * tkPrev * tkPrev;
              const lum = env * (1 - tk / 0.92) * (1 - k * 0.18);
              if (lum <= 0.06) continue;
              drawSegment(px, py, sx, sy, mix3(f.col, WHITE, k === 0 ? 0.6 : 0.1), lum * 1.24);
              if (k === 0) {
                paintSpark(Math.round(sy), Math.round(sx), 42, WHITE, lum * 1.30);
              }
            }
          }
        }
        renderBargeFans(4.90, 1.75, false);  // Side wing fan burst
        renderBargeFans(11.35, 5.20, true);  // Grand Finale 3-barge peacock plumes

        // 7. Shimmering afterglow ember rain (Act 5: 15.6 .. 19.6)
        if (lt >= 15.6 && lt <= 19.6) {
          const et = lt - 15.6;
          const env = et < 0.6 ? et / 0.6 : Math.max(0, (4.0 - et) / 1.4);
          for (let i = 0; i < sc.embers.length; i++) {
            const em = sc.embers[i];
            const ex = Math.round(em.x + em.vx * et + Math.sin(nowT * 1.8 + em.phase) * 0.7);
            const ey = Math.round(em.y + em.vy * et);
            if (ey < 0 || ey >= V3_SEA_Y || ex < 0 || ex >= COLS) continue;
            const tw = 0.25 + 0.85 * Math.pow(0.5 + 0.5 * Math.sin(nowT * 14 + em.phase), 2);
            const lum = env * tw * 0.9;
            if (lum > 0.08) {
              paintSpark(ey, ex, lum > 0.58 ? 42 : lum > 0.30 ? 43 : 46, em.col, lum);
            }
          }
        }

        // 8. Radiant Dynamic Bay Water Reflection (rows 51..63)
        // Mirrors sky shells, Niagara, and barge fans into shimmering vertical pillars & horizontal ripples
        for (let r = V3_SEA_Y; r < 64; r++) {
          const k = r - V3_SEA_Y;
          const srcBase = Math.round(50 - k * 3.1);
          const shift = Math.round(
            Math.sin(k * 0.78 + nowT * 2.2) * (0.35 + 0.15 * k) +
            Math.cos(k * 1.65 - nowT * 2.9) * 0.40
          );
          const atten = 0.85 * (1 - k / 15.5);
          for (let c = 0; c < COLS; c++) {
            const scCol = c - shift;
            if (scCol < 0 || scCol >= COLS) continue;
            let bestR = 0, bestG = 0, bestB = 0, bestM = 0;
            for (let dr = -2; dr <= 2; dr++) {
              const sr = clamp(srcBase + dr, 4, V3_SEA_Y - 1);
              const si = sr * COLS + scCol;
              if (frameChar[si] < 33) continue;
              const m = cellMax(frameCol, si);
              if (m > bestM) {
                bestM = m;
                bestR = frameCol[si * 3];
                bestG = frameCol[si * 3 + 1];
                bestB = frameCol[si * 3 + 2];
              }
            }
            if (bestM <= 0.12) continue;
            const ripple = 0.58 + 0.42 * Math.sin(c * 0.42 + k * 1.45 - nowT * 3.5);
            const rr = bestR * atten * ripple;
            const gg = bestG * atten * ripple;
            const bb = Math.min(bestB * atten * 1.06 * ripple, 1.08);
            const idx = r * COLS + c;
            if (Math.max(rr, gg, bb) > cellMax(frameCol, idx)) {
              const pw = bestM * atten * ripple;
              const ch = pw > 0.65 ? 124 : pw > 0.42 ? 61 : pw > 0.24 ? 58 : 45; // '|', '=', ':', '-'
              frameChar[idx] = ch;
              frameCol[idx * 3] = rr;
              frameCol[idx * 3 + 1] = gg;
              frameCol[idx * 3 + 2] = bb;
            }
          }
        }

        // 9. Gentle surf foam along curved Gwangalli beach (rows 63..65)
        const tide = 0.5 + 0.5 * Math.sin(nowT * 0.9);
        for (let c = 0; c < COLS; c++) {
          const shore = 63.6 + 0.75 * Math.sin(c * 0.065 + 0.4) - tide * 0.9;
          const rFoam = Math.round(shore);
          if (rFoam >= V3_SEA_Y && rFoam < 66) {
            const shimmer = 0.24 + 0.22 * (0.5 + 0.5 * Math.sin(c * 0.32 - nowT * 1.6));
            putCell(frameChar, frameCol, rFoam, c, (c + Math.floor(nowT * 2)) % 4 === 0 ? 61 : 45, V3_SURF, shimmer);
          }
          if (rFoam + 1 < 66 && (c % 2 === 0)) {
            putCell(frameChar, frameCol, rFoam + 1, c, 46, V3_SURF, 0.12 * (1 - tide * 0.4));
          }
        }

        // 10. Holiday banner on dark sand foreground (row 67, clear above bottom-left HUD)
        if (nowT > V3_T_MSG) {
          const row = ROWS - 7;
          const x0 = Math.floor((COLS - MESSAGE.length) / 2);
          for (let i = -1; i <= MESSAGE.length; i++) {
            const a = clamp((nowT - V3_T_MSG - Math.max(i, 0) * 0.06) / 0.4, 0, 1);
            if (a <= 0) continue;
            const x = x0 + i;
            if (x < 0 || x >= COLS) continue;
            frameChar[row * COLS + x] = 0;
            const ch = i >= 0 && i < MESSAGE.length ? MESSAGE[i] : " ";
            if (ch === " ") continue;
            const shimmer = 0.78 + 0.22 * Math.sin(i * 0.4 - nowT * 2.4);
            const col = mix3(V3_CHAMPAGNE, WHITE, 0.25 + 0.25 * Math.sin(i * 0.25 + nowT * 1.6));
            putCell(frameChar, frameCol, row, x, ch.charCodeAt(0), col, shimmer * a);
          }
        }
      }

      // ===================== Shared drawing =====================
      function renderAndDraw(nowT) {
        const bg = bgs[currentVer];
        const groundCanvas = groundCanvases[currentVer];
        if (currentVer === 3) composeV3(nowT);
        else if (currentVer === 2) composeV2(nowT);
        else composeV1(nowT);

        // Blit static ground + batch changed background clears & foreground glyphs onto artCanvas
        artCtx.drawImage(groundCanvas, 0, 0, W, H);
        artCtx.font = `${FONT_PX}px ${MONO}`;
        artCtx.textAlign = "center";
        artCtx.textBaseline = "middle";

        artCtx.fillStyle = SKY_CSS;
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const idx = r * COLS + c;
            const code = frameChar[idx];
            const gCode = bg.groundChar[idx];
            if (gCode < 32) continue;
            const i3 = idx * 3;
            if (
              code === gCode &&
              frameCol[i3] === bg.groundCol[i3] &&
              frameCol[i3 + 1] === bg.groundCol[i3 + 1] &&
              frameCol[i3 + 2] === bg.groundCol[i3 + 2]
            ) {
              continue;
            }
            artCtx.fillRect(c * CW, r * CH, CW, CH);
          }
        }

        let lastColorKey = -1;
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const idx = r * COLS + c;
            const code = frameChar[idx];
            if (code < 32) continue;
            const i3 = idx * 3;
            const cr = frameCol[i3], cg = frameCol[i3 + 1], cb = frameCol[i3 + 2];
            if (
              code === bg.groundChar[idx] &&
              cr === bg.groundCol[i3] &&
              cg === bg.groundCol[i3 + 1] &&
              cb === bg.groundCol[i3 + 2]
            ) {
              continue;
            }
            const rc = clamp(Math.round(cr * 255), 0, 255);
            const gc = clamp(Math.round(cg * 255), 0, 255);
            const bc = clamp(Math.round(cb * 255), 0, 255);
            const colorKey = (rc << 16) | (gc << 8) | bc;
            if (colorKey !== lastColorKey) {
              artCtx.fillStyle = `rgb(${rc},${gc},${bc})`;
              lastColorKey = colorKey;
            }
            artCtx.fillText(CHAR_STR[code] || String.fromCharCode(code), c * CW + CW * 0.5, r * CH + CH * 0.5);
          }
        }

        // Copy artCanvas to main canvas + subtle phosphor glow pass
        ctx.drawImage(artCanvas, 0, 0, W, H);
        ctx.fillStyle = SKY_CSS;
        ctx.fillRect(0, H, W, HUD_H);

        glowCtx.clearRect(0, 0, glowCanvas.width, glowCanvas.height);
        glowCtx.drawImage(artCanvas, 0, 0, glowCanvas.width, glowCanvas.height);
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = currentVer === 2 ? 120 / 255 : currentVer === 3 ? 135 / 255 : 95 / 255;
        ctx.drawImage(glowCanvas, 0, 0, W, H);
        ctx.restore();

        // Top-right timer + status dot
        ctx.font = `${FONT_PX - 2}px ${MONO}`;
        ctx.textAlign = "right";
        ctx.textBaseline = "top";
        const tLabel = `t ${nowT.toFixed(2).padStart(5, "0")}s`;
        const tWidth = ctx.measureText(tLabel).width;
        const txRight = W - 16;
        const ty = 12;
        ctx.fillStyle = ACCENT_CSS;
        ctx.fillText(tLabel, txRight, ty);
        ctx.beginPath();
        ctx.arc(txRight - tWidth - 12, ty + 7, 4, 0, TAU);
        ctx.fillStyle = paused ? DIM_CSS : ACCENT_CSS;
        ctx.fill();

        // Bottom-left signature
        const padX = 14;
        const baseY = H - 28;
        ctx.textAlign = "left";
        ctx.fillStyle = SIGN_CSS;
        ctx.fillText("jaeyonni", padX, baseY);
      }

      function drawCanvasFooter() {
        ctx.fillStyle = SKY_CSS;
        ctx.fillRect(0, H, W, HUD_H);
        ctx.font = `${FONT_PX - 2}px ${MONO}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = DIM_CSS;
        ctx.fillText(HINT_PARTS.map((p) => p.label).join(""), W * 0.5, H + HUD_H * 0.5);
      }

      function updatePauseUi() {
        btnPause.classList.toggle("paused-on", paused);
        pauseDeskLbl.textContent = paused ? "Space resume" : "Space pause";
        pauseMobLbl.textContent = paused ? "Resume" : "Pause";
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.download = filename;
        link.href = url;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      }

      function saveScreenshot() {
        const d = new Date();
        const pad2 = (n) => String(n).padStart(2, "0");
        const stamp = `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
        const slugs = ["xmas_tree", "lake_of_light", "gwangalli"];
        const filename = `${slugs[currentVer - 1]}_${stamp}.png`;

        drawCanvasFooter();
        const onBlob = (blob) => {
          ctx.fillStyle = SKY_CSS;
          ctx.fillRect(0, H, W, HUD_H);
          if (!blob) return;
          if (isMobile && navigator.share && navigator.canShare) {
            try {
              const file = new File([blob], filename, { type: "image/png" });
              if (navigator.canShare({ files: [file] })) {
                navigator.share({ files: [file], title: "ASCII Christmas Tree" }).catch((err) => {
                  if (!err || err.name !== "AbortError") {
                    downloadBlob(blob, filename);
                  }
                });
                return;
              }
            } catch (_) {
              // fallback below
            }
          }
          downloadBlob(blob, filename);
        };
        if (canvas.toBlob) {
          canvas.toBlob(onBlob, "image/png");
        } else {
          const link = document.createElement("a");
          link.download = filename;
          link.href = canvas.toDataURL("image/png");
          ctx.fillStyle = SKY_CSS;
          ctx.fillRect(0, H, W, HUD_H);
          link.click();
        }
      }

      function setVersion(ver) {
        if (ver !== 1 && ver !== 2 && ver !== 3) return;
        currentVer = ver;
        btnVer1.classList.toggle("active", ver === 1);
        btnVer2.classList.toggle("active", ver === 2);
        btnVer3.classList.toggle("active", ver === 3);
        t = 0.0;
        paused = false;
        lastTs = null;
        nextFrame = 0;
        updatePauseUi();
        renderAndDraw(0.0);
      }

      function triggerAction(action) {
        if (action === "pause") {
          paused = !paused;
          if (!paused) lastTs = null;
          updatePauseUi();
          renderAndDraw(t);
        } else if (action === "restart") {
          t = 0.0;
          paused = false;
          lastTs = null;
          nextFrame = 0;
          updatePauseUi();
          renderAndDraw(0.0);
        } else if (action === "save") {
          renderAndDraw(t);
          saveScreenshot();
        }
      }

      btnVer1.addEventListener("click", () => setVersion(1));
      btnVer2.addEventListener("click", () => setVersion(2));
      btnVer3.addEventListener("click", () => setVersion(3));
      btnPause.addEventListener("click", () => triggerAction("pause"));
      btnRestart.addEventListener("click", () => triggerAction("restart"));
      btnSave.addEventListener("click", () => triggerAction("save"));

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
          lastTs = null;
        }
      });

      window.addEventListener("keydown", (ev) => {
        if (ev.code === "Space") {
          ev.preventDefault();
          triggerAction("pause");
        } else if (ev.key === "r" || ev.key === "R") {
          triggerAction("restart");
        } else if (ev.key === "s" || ev.key === "S") {
          triggerAction("save");
        } else if (ev.key === "1") {
          setVersion(1);
        } else if (ev.key === "2") {
          setVersion(2);
        } else if (ev.key === "3") {
          setVersion(3);
        }
      });

      // Optional deep link: #ver2 / #ver3 opens that scene directly
      if (window.location.hash === "#ver2" || window.location.hash === "#lake") {
        currentVer = 2;
      } else if (window.location.hash === "#ver3" || window.location.hash === "#gwangalli") {
        currentVer = 3;
      }
      btnVer1.classList.toggle("active", currentVer === 1);
      btnVer2.classList.toggle("active", currentVer === 2);
      btnVer3.classList.toggle("active", currentVer === 3);

      function tick(ts) {
        if (lastTs === null) {
          lastTs = ts;
          nextFrame = ts;
        }
        const dt = Math.min((ts - lastTs) / 1000.0, 0.25);
        lastTs = ts;
        if (!paused) t += dt;

        if (ts + 0.5 >= nextFrame) {
          renderAndDraw(t);
          nextFrame += FRAME_MS;
          if (nextFrame <= ts) nextFrame = ts + FRAME_MS;
        }
        requestAnimationFrame(tick);
      }

      updatePauseUi();
      renderAndDraw(0.0);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
